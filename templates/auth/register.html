{% extends "layouts/base.html" %}
{% block title %}Register{% endblock %}

{% block body %}
<div class="auth-page d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="auth-card card shadow-lg border-0" style="max-width: 500px; width: 100%;">
        <div class="auth-card-header text-center py-4">
            <i class="bi bi-mountain-sun-fill display-4 text-white"></i>
            <h1 class="h3 text-white mt-2 mb-0 fw-bold">Create Account</h1>
            <p class="text-white-50 mb-0 small">Join TrekApp today</p>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('auth.register') }}" novalidate>

                <!-- Role Selection -->
                <div class="mb-3">
                    <label class="form-label fw-medium">I am registering as a</label>
                    <div class="d-flex gap-2">
                        <div class="form-check flex-fill border rounded-3 p-3 role-option" id="role-trekker-card">
                            <input class="form-check-input" type="radio" name="role" id="role_trekker" value="trekker" checked>
                            <label class="form-check-label w-100" for="role_trekker">
                                <i class="bi bi-person-walking me-1 text-primary"></i>
                                <span class="fw-medium">Trekker</span>
                                <small class="d-block text-muted">Explore and book treks</small>
                            </label>
                        </div>
                        <div class="form-check flex-fill border rounded-3 p-3 role-option" id="role-staff-card">
                            <input class="form-check-input" type="radio" name="role" id="role_staff" value="staff">
                            <label class="form-check-label w-100" for="role_staff">
                                <i class="bi bi-person-badge me-1 text-success"></i>
                                <span class="fw-medium">Trek Staff</span>
                                <small class="d-block text-muted">Manage trek operations</small>
                            </label>
                        </div>
                    </div>
                </div>

                <hr class="my-3">

                <!-- Account Info -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="full_name" class="form-label fw-medium">Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Jane Doe">
                    </div>
                    <div class="col-md-6">
                        <label for="username" class="form-label fw-medium">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="3-20 alphanumeric" required>
                    </div>
                    <div class="col-12">
                        <label for="email" class="form-label fw-medium">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="you@example.com" required>
                    </div>
                    <div class="col-12">
                        <label for="password" class="form-label fw-medium">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Minimum 6 characters" required>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-medium">Phone</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="Optional">
                    </div>
                    <div class="col-md-6">
                        <label for="address" class="form-label fw-medium">City / Address</label>
                        <input type="text" class="form-control" id="address" name="address" placeholder="Optional">
                    </div>
                </div>

                <!-- Staff Note -->
                <div class="alert alert-warning small mt-3 mb-0 py-2" id="staff-note" style="display:none;">
                    <i class="bi bi-info-circle me-1"></i>
                    Staff accounts require <strong>Admin approval</strong> before you can log in.
                </div>

                <button type="submit" class="btn btn-trek w-100 py-2 fw-semibold mt-4">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>
            <hr class="my-4">
            <p class="text-center text-muted mb-0 small">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-medium">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Show/hide staff approval notice based on role selection
    document.querySelectorAll('input[name="role"]').forEach(radio => {
        radio.addEventListener('change', () => {
            const note = document.getElementById('staff-note');
            note.style.display = radio.value === 'staff' ? 'block' : 'none';
        });
    });
</script>
{% endblock %}
