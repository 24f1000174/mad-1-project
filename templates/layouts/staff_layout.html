{% extends "layouts/base.html" %}

{% block body %}
<div class="dashboard-wrapper">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="sidebar-brand" href="{{ url_for('staff.dashboard') }}">
                <i class="bi bi-mountain-sun-fill me-2"></i>
                <span>TrekStaff</span>
            </a>
        </div>

        <ul class="sidebar-nav">
            <li class="sidebar-item">
                <a href="{{ url_for('staff.dashboard') }}" class="sidebar-link {% if request.endpoint == 'staff.dashboard' %}active{% endif %}">
                    <i class="bi bi-speedometer2"></i> My Treks
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="sidebar-user-info">
                <i class="bi bi-person-circle me-2"></i>
                <span>{{ current_user.username }}</span>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="sidebar-link text-danger mt-2">
                <i class="bi bi-box-arrow-left"></i> Logout
            </a>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="main-content">
        <header class="top-navbar">
            <button class="sidebar-toggle btn btn-link" id="sidebar-toggle">
                <i class="bi bi-list fs-4"></i>
            </button>
            <div class="top-navbar-title">{% block page_title %}{% endblock %}</div>
            <div class="top-navbar-right">
                <span class="badge bg-success-subtle text-success-emphasis rounded-pill px-3 py-2">
                    <i class="bi bi-person-badge-fill me-1"></i> Staff
                </span>
            </div>
        </header>
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const toggle = document.getElementById('sidebar-toggle');
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('main-content');
    toggle.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        main.classList.toggle('expanded');
    });
</script>
{% endblock %}
